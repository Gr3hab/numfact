# Prüft die Weiterleitung der alten Adresse nach https://ciphro.eu (Spiel und Fakten liegen jetzt in Gr3hab/ciphro).
# Den ganzen Umzug mit dem echten neuen Spiel prüft lokal: CIPHRO_DIR=/pfad/zu/ciphro npm test
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: _dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _dev/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
