<script>
/* NUMIGMA heißt seit November 2026 CIPHRO und liegt unter https://ciphro.eu. Diese Adresse leitet nur noch weiter.
   Der Browser speichert pro Adresse. Deshalb geht der Spielstand (numfact.v2) im Anker mit: #import=<Base64url von JSON>.
   Der Anker wird nie an einen Server geschickt. ciphro.eu übernimmt ihn und entfernt ihn sofort aus der Adresse.
   Ohne Spielstand: #moved (dann sagt ciphro.eu nur, dass NUMIGMA jetzt CIPHRO heißt). Dieser Block ist in index.html,
   en/index.html und 404.html gleich (die Tests prüfen das). */
(function () {
  var NEW = 'https://ciphro.eu/';
  var base = /^\/numfact\//.test(location.pathname) ? '/numfact/' : '/';
  var rest = location.pathname.slice(base.length);
  var hash = '#moved';
  try {
    var raw = localStorage.getItem('numfact.v2');
    var s = raw && JSON.parse(raw);
    if (s && s.v === 2 && s.days && typeof s.days === 'object') {
      var b = new TextEncoder().encode(raw), bin = '';
      for (var i = 0; i < b.length; i += 8192) bin += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
      hash = '#import=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  } catch (e) { /* privat, blockiert oder kaputt: ohne Spielstand weiter */ }
  var url = NEW + (/^en(\/|$)/.test(rest) ? 'en/' : '') + location.search + hash;
  window.CIPHRO_URL = url;
  var done = false, go = function () { if (!done) { done = true; location.replace(url); } };
  // Alte Offline-Hilfe dieser Adresse abmelden (nur die von /numfact/, nicht andere Seiten auf gr3hab.github.io)
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      setTimeout(go, 500);
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.filter(function (r) { return r.scope === location.origin + base; }).map(function (r) { return r.unregister(); }));
      }).then(go, go);
      return;
    }
  } catch (e) { /* weiter */ }
  go();
})();
</script>
