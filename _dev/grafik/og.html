<!doctype html><html><head><meta charset="utf-8">
<!-- Vorschaubilder für geteilte Links, 1200×630: og-de.png (?lang=de) und og-en.png (?lang=en), gleiches Design, nur der Slogan in der Sprache.
     Erzeugen im Ordner _dev: node grafik/render.js -->
<style>
@font-face{font-family:"Martian Mono";font-weight:800;src:url(../../fonts/martian-mono-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Martian Mono";font-weight:700;src:url(../../fonts/martian-mono-latin-700-normal.woff2) format("woff2")}
html,body{margin:0}
body{width:1200px;height:630px;box-sizing:border-box;padding:0 60px;background:#f2f4f7;color:#17202e;
 background-image:linear-gradient(#dfe6f0 2px,transparent 2px),linear-gradient(90deg,#dfe6f0 2px,transparent 2px);background-size:60px 60px;background-position:-1px -1px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.logo{position:relative;display:flex;padding:14px 18px 22px}
.logo::before{content:"";position:absolute;inset:0 -10px;background:#8fe3a0;border-radius:10px 30px 12px 28px;transform:rotate(-1.2deg)}
.col{position:relative;display:flex;flex-direction:column;align-items:center;width:150px}
.col b{height:72px;display:grid;place-items:center;font-family:"Martian Mono",monospace;font-weight:800;font-size:46px;color:#0f2414;letter-spacing:-.02em}
.col span{height:132px;display:grid;place-items:center;font-family:"Martian Mono",monospace;font-weight:800;font-size:118px;line-height:1;color:#0f2414}
.col.num span{color:#1f3fa6}
.tag{font-family:"Martian Mono",monospace;font-weight:800;font-size:64px;line-height:1.12;text-align:center;white-space:nowrap;display:flex;flex-direction:column;align-items:center}
.tag span{background:#f2f4f7;padding:0 10px}
.tag em{font-style:normal;color:#1f3fa6}
</style></head><body>
<div class="logo">
  <div class="col num"><b>14</b><span>N</span></div><div class="col num"><b>21</b><span>U</span></div><div class="col num"><b>13</b><span>M</span></div>
  <div class="col"><b>9</b><span>I</span></div><div class="col"><b>7</b><span>G</span></div><div class="col"><b>13</b><span>M</span></div><div class="col"><b>1</b><span>A</span></div>
</div>
<div class="tag" id="tag"><span>CRACK THE CODE.</span><span><em>REVEAL THE FACT.</em></span></div>
<script>
  if (/[?&]lang=de\b/.test(location.search)) document.getElementById('tag').innerHTML = '<span>KNACKE DEN CODE.</span><span><em>ENTDECKE DEN FAKT.</em></span>';
</script>
</body></html>
