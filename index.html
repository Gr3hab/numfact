</script>
<style>
/* NUMIGMA. Layout: App-Bildschirm in einer Spalte. Oben Kopf, Stufen und Uhr, in der Mitte das Rätselblatt (scrollt),
   unten Tipps und eigene Tastatur. Karopapier mit Ziffern in Königsblau, gelöste Wörter mit grünem Textmarker,
   Fehler in Rotstift, Tipps in Bleistift. */
:root{
  --paper:#f2f4f7; --sheet:#ffffff; --grid:#e3e9f1; --line:#d2d9e3; --text:#17202e; --muted:#596377;
  --ink:#1f3fa6; --ok:#17803a; --marker:#8fe3a0; --marker-text:#0f2414; --red:#c62f27; --pencil:#7a808b;
  --key:#dfe5ee; --key-hi:#cfd8e6; --cellbg:#ffffff; --cellline:#b8c2d0; --curbg:#e6ecfb; --scrim:rgba(10,14,22,.55);
  --display:"Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:8px; --kh:48px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111715; --sheet:#19221f; --grid:#25312d; --line:#2f3b37; --text:#e6ece8; --muted:#9ba7a2;
    --ink:#a5b9ff; --ok:#5fd47f; --marker:#46b864; --marker-text:#07140b; --red:#ff7d70; --pencil:#8f9a95;
    --key:#2a3532; --key-hi:#35423e; --cellbg:#1d2724; --cellline:#44524d; --curbg:#24304a; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111715; --sheet:#19221f; --grid:#25312d; --line:#2f3b37; --text:#e6ece8; --muted:#9ba7a2;
  --ink:#a5b9ff; --ok:#5fd47f; --marker:#46b864; --marker-text:#07140b; --red:#ff7d70; --pencil:#8f9a95;
  --key:#2a3532; --key-hi:#35423e; --cellbg:#1d2724; --cellline:#44524d; --curbg:#24304a; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{
  height:100vh;height:100dvh;max-width:620px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px;flex:none}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.32rem;line-height:1.1;letter-spacing:.01em;white-space:nowrap}
.brand h1 .a{color:var(--ink)}
.issue{margin:3px 0 0;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.icons{display:flex;gap:6px;flex:none}
.ib{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);cursor:pointer;padding:0;color:var(--text)}
.ib:hover{border-color:var(--ink);color:var(--ink)}
.ib svg{width:20px;height:20px}

.banner{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;margin-bottom:8px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--sheet);font-size:.92rem;font-weight:700}
.banner.archive{border-color:var(--line);font-weight:400}
.banner .btn{min-height:34px;padding:4px 12px}

/* Stufen */
.modes{flex:none;display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:5px}
.mode{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:6px 2px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.mode:hover{border-color:var(--ink)}
.mode .n{font-weight:700;font-size:.82rem;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mode .st{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2;display:flex;align-items:center;gap:3px}
.mode .st svg{width:12px;height:12px}
.mode[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode.done .st{color:var(--ok);font-weight:700}

/* Leiste mit Regel, Fortschritt, Uhr */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding-block:8px}
.rulechip{min-width:0;flex:1;display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--display);font-weight:500;font-size:.74rem;letter-spacing:.02em}
.rulechip span{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rulechip svg{width:16px;height:16px;flex:none}
.progress{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.timer svg{width:18px;height:18px}
.timer.stopped{color:var(--muted)}

/* Bühne: Startkarte, Rätselblatt, Ergebnis */
.stage:focus-visible{outline-offset:-2px}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding-bottom:12px;overscroll-behavior:contain}
.sheet{
  --cell:24px;
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:var(--cell) var(--cell);
  background-position:calc(var(--cell) / 2) calc(var(--cell) / 2);
  border:1px solid var(--line);border-radius:3px;
  padding:calc(var(--cell) / 2);
  flex:none;
}
.words{display:flex;flex-wrap:wrap;column-gap:var(--cell);row-gap:var(--cell);align-items:flex-start}
.w{position:relative;width:calc(var(--cell) * var(--u));display:flex;flex-direction:column;cursor:pointer;border-radius:2px}
.dr,.lr{display:flex;flex-wrap:wrap;position:relative;z-index:1}
.dr{min-height:var(--cell)}
.d{width:calc(var(--cell) / 2);height:var(--cell);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:calc(var(--cell) * .54);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.easy .d{width:var(--cell);font-size:calc(var(--cell) * .46);letter-spacing:-.03em}
.d.cut{box-shadow:inset 2px 0 0 var(--pencil)}
.c{width:var(--cell);height:var(--cell);display:grid;place-items:center;background:var(--cellbg);box-shadow:inset 0 0 0 1px var(--cellline);font-weight:700;font-size:calc(var(--cell) * .62);line-height:1;color:var(--text);user-select:none;-webkit-user-select:none}
.c.hint{color:var(--pencil)}
.w.act .c{box-shadow:inset 0 0 0 1px var(--ink)}
.w.act .c.cur{box-shadow:inset 0 0 0 3px var(--ink);background:var(--curbg)}
.w.act::after{content:"";position:absolute;left:-4px;right:-4px;top:-4px;bottom:-4px;border:1.5px dashed var(--ink);border-radius:4px;opacity:.55;pointer-events:none}
.w.bad .c{color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.w.bad.act .c.cur{box-shadow:inset 0 0 0 3px var(--red)}
.w.ok::before,.w.given::before{content:"";position:absolute;inset:-3px -5px;z-index:0;border-radius:3px 10px 4px 9px;transform:rotate(-.6deg)}
.w.ok::before{background:var(--marker)}
.w.ok .c{background:transparent;box-shadow:none;color:var(--marker-text)}
.w.ok .d{color:var(--marker-text)}
.w.ok .c.hint{color:var(--marker-text);opacity:.6}
.w.ok .c,.w.ok .d{transition:color .1s .3s}
.w.ok .d.cut{box-shadow:inset 2px 0 0 var(--marker-text)}
.w.given .c{color:var(--pencil);box-shadow:inset 0 -2px 0 0 var(--pencil);background:transparent}
.w.locked{cursor:default}
.w.flash::before{animation:swipe .45s ease-out both}
.w.shake{animation:shake .32s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes swipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

.nojs{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.nojs p{margin:0;font-size:.95rem}

.startcard{
  flex:none;background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;border:1px solid var(--line);border-radius:3px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start
}
.startcard .sc-mode{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1}
.startcard .sc-meta{font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.startcard p{margin:0;max-width:60ch;background:var(--sheet)}
.startcard .ex{font-family:var(--display);font-size:.82rem;font-weight:500;color:var(--ink)}
.startcard .note{font-size:.9rem;color:var(--muted)}
.startcard .small{font-size:.85rem;color:var(--muted)}

/* Ergebnis */
.result{flex:none;display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--text);padding-top:14px}
.result .label{font-family:var(--display);font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.result .squares{font-size:1.15rem;letter-spacing:.06em;line-height:1.2}
.result .fact{margin:0;font-size:clamp(1.25rem, 4.6vw, 1.6rem);font-weight:700;line-height:1.28;text-wrap:balance}
.result .more{margin:0;color:var(--muted);max-width:62ch}
.result .daydone{margin:0;font-weight:700}
.result .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.countdown{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);font-weight:700;font-size:.95rem;cursor:pointer;color:var(--text);text-align:center;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{min-height:52px;padding-inline:26px;font-size:1.05rem}
.btn.danger{border-color:var(--red);color:var(--red)}

/* Unten: Tipps und Tastatur */
.dock{flex:none;display:flex;flex-direction:column;gap:8px;padding-block:6px 10px;border-top:1px solid var(--line);background:var(--paper)}
.tools{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);font-weight:700;font-size:.88rem;cursor:pointer;color:var(--text);white-space:nowrap}
.tool:hover:not(:disabled){border-color:var(--ink)}
.tool svg{width:17px;height:17px;flex:none}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.tool.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.tool.ghost:hover{color:var(--red)}
.tool sup{font-size:.68rem;color:var(--muted);font-weight:700;margin-left:-2px}
.pips{display:inline-flex;gap:3px;margin-left:2px}
.pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.pips i.on{background:var(--ink)}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--red);border-radius:var(--r);background:var(--sheet)}
.confirm span{flex:1 1 200px;font-size:.92rem}
.confirm .btn{min-height:38px}

.kb{display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.kr{display:flex;gap:4px}
.k{position:relative;flex:1 1 0;min-width:0;height:var(--kh);display:grid;place-items:center;border-radius:6px;background:var(--key);color:var(--text);font-weight:700;font-size:1.05rem;cursor:pointer;touch-action:manipulation;overflow:hidden}
.k:active,.k.down{background:var(--key-hi)}
.k.wide{flex:1.5 1 0;font-size:.95rem}
.k svg{width:22px;height:22px}
.k i{position:absolute;top:2px;right:3px;font-style:normal;font-family:var(--display);font-size:.62rem;font-weight:700;color:var(--ink);line-height:1}
.kb.off .k{opacity:.5}
.hsw{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;clip-path:inset(0 round 999px);touch-action:manipulation}
.no-haptics .hsw{display:none}
@media (max-width:380px){
  .brand h1{font-size:1.08rem}
  .issue{font-size:.8rem}
  .icons{gap:4px}
  .ib{width:34px;height:34px}
  .ib svg{width:18px;height:18px}
  .mode .n{font-size:.75rem;letter-spacing:-.02em}
  .mode .st{font-size:.7rem}
  .tools{gap:4px}
  .tool{font-size:.8rem;padding:4px 6px;gap:4px}
  .tool svg{width:15px;height:15px}
  .pips i{width:7px;height:7px}
  .kr{gap:3px}
}
@media (max-height:700px){ :root{--kh:42px} .top{padding-block:6px 6px} .bar{padding-block:5px} }
@media (max-height:600px){ :root{--kh:38px} .kb{gap:4px} }

/* Dialoge */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--text);padding:0;width:min(470px, calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:var(--scrim)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg h2{margin:0;font-family:var(--display);font-size:1.05rem;font-weight:800}
.dlg h3{margin:0 0 6px;font-size:.76rem;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dlg p{margin:0}
.small{font-size:.88rem;color:var(--muted)}
.howto{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:7px}
.demo{align-self:flex-start;display:flex;gap:0;background-color:var(--sheet);background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);background-size:24px 24px;border:1px solid var(--line);padding:12px}
.demo div{display:flex;flex-direction:column}
.demo b{width:28px;height:24px;display:grid;place-items:center;font-family:var(--display);font-size:.78rem;color:var(--ink)}
.demo span{width:28px;height:28px;display:grid;place-items:center;font-weight:700;background:var(--cellbg);box-shadow:inset 0 0 0 1px var(--cellline)}
.stats{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:8px;text-align:center}
.stats .n{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stats .l{font-size:.76rem;color:var(--muted);line-height:1.25;margin-top:4px}
.table{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;font-size:.92rem}
.table .h{font-size:.74rem;color:var(--muted)}
.table .r{text-align:right;font-variant-numeric:tabular-nums}
.table .track{height:9px;background:var(--grid);border-radius:2px;overflow:hidden}
.table .fill{display:block;height:100%;background:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg label{display:flex;align-items:center;justify-content:center;min-height:42px;cursor:pointer;font-weight:700;font-size:.92rem;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{color:var(--ink)}
.seg label:has(input:checked){background:var(--curbg);box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:-3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row input[type="checkbox"]{width:44px;height:26px;accent-color:var(--ink);cursor:pointer}
.days{display:flex;flex-direction:column;gap:6px;max-height:min(56dvh, 460px);overflow-y:auto;padding-right:2px}
.day{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);cursor:pointer;text-align:left}
.day:hover{border-color:var(--ink)}
.day .t{font-weight:700}
.day .t small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.marks{display:flex;gap:4px}
.marks span{width:22px;height:22px;display:grid;place-items:center;border-radius:4px;font-size:.7rem;font-weight:700;background:var(--grid);color:var(--muted)}
.marks .s{background:var(--marker);color:var(--marker-text)}
.marks .v{background:transparent;box-shadow:inset 0 0 0 1px var(--pencil);color:var(--pencil)}
.marks .p{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);background:transparent}
textarea{width:100%;font:inherit;font-size:.95rem;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--text);resize:vertical}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:50;background:var(--text);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-weight:700;font-size:.92rem;max-width:calc(100vw - 32px);box-shadow:0 6px 24px var(--scrim);text-align:center}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (min-width:640px){ .modes .mode .n{font-size:.95rem} }
@media (prefers-reduced-motion: reduce){ .w.shake,.w.flash::before{animation:none} .w.ok .c,.w.ok .d{transition:none} }

.legend{font-size:.84rem;color:var(--muted);margin-top:-4px}
.eyebrow{font-family:var(--display);font-size:.68rem;font-weight:700;letter-spacing:.09em;color:var(--ink);margin-bottom:4px}
.seg.two{grid-template-columns:repeat(2, minmax(0,1fr))}
</style>
</head>
<body>
<div class="app" id="app">

function fmtTime(ms) {
  const t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function fmtHMS(ms) { const t = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(t / 3600), Math.floor(t % 3600 / 60), t % 60].map(v => String(v).padStart(2, '0')).join(':'); }
function dateLabel(key, long) {
  const [y, m, d] = parseKey(key);

  catch (e) { return key; }

}

function save() { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(store)); } catch (e) { /* ignorieren */ } }

function dayState(key) { const map = daysMap(); return map[key] || (map[key] = {}); }
function msFor(key, id, p) {
  const st = dayState(key);
  let s = st[id];
  if (!s || s.sig !== p.sig || !Array.isArray(s.typed) || s.typed.length !== p.words.length) {
    s = st[id] = { sig: p.sig, typed: p.words.map(() => ''), hints: {}, hintCount: 0, cuts: [], status: 'open', elapsed: 0, given: [] };
  }
  if (!s.hints) s.hints = {};
  if (!s.cuts) s.cuts = [];
  if (!s.given) s.given = [];
  return s;
}
const ms = id => msFor(day.key, id, day.puzzles[id]);
const finished = s => s.status === 'solved' || s.status === 'revealed';
const hintsLeft = s => Math.max(0, CONFIG.hintsPerPuzzle - (s.hintCount || 0));
const keyForbidden = s => current === 'impossible' && !s.shiftShown;
const keyCost = () => current === 'easy' ? 0 : 1;
const modeName = id => MODES.find(m => m.id === id).name;

function lettersOf(wi) { return [...puz().words[wi].plain]; }
function cellsOf(s, wi) {
  const n = lettersOf(wi).length, a = [...(s.typed[wi] || '')].map(c => c === '_' ? '' : c);
  while (a.length < n) a.push('');
  return a.slice(0, n);
}
function setCells(s, wi, a) { s.typed[wi] = a.map(c => c || '_').join('').replace(/_+$/, ''); }
function isSolvedW(wi, s) { return ((s || ms(current)).typed[wi] || '') === puz().words[wi].plain; }
const allSolved = () => puz().words.every((w, i) => isSolvedW(i));
function nextUnsolved(from, dir) {
  dir = dir || 1;
  const n = puz().words.length;
  for (let k = 1; k <= n; k++) { const i = (((from + dir * k) % n) + n) % n; if (!isSolvedW(i)) return i; }
  return -1;
}
function nextOpenMode(from) {
  const i = MODES.findIndex(m => m.id === from);
  for (let k = 1; k < MODES.length; k++) { const m = MODES[(i + k) % MODES.length]; if (!finished(ms(m.id))) return m; }
  return null;
}

/* ============================================================ Uhr: läuft ab „Start“, nur solange das Rätsel sichtbar ist */
const canRun = () => !document.hidden && !document.querySelector('dialog[open]');
function stopClock() {
  if (!clock) return;
  const map = daysMap(clock.lang), st = map[clock.key] && map[clock.key][clock.mode];
  if (st && st.status === 'playing') st.elapsed = (st.elapsed || 0) + (Date.now() - clock.start);
  clock = null;
  save();
}
function startClock() {
  stopClock();
  if (ms(current).status !== 'playing' || !canRun()) return;
  clock = { mode: current, key: day.key, lang, start: Date.now() };
}
function resumeClock() { if (day && !clock && ms(current).status === 'playing' && canRun()) startClock(); renderTimer(); }
function elapsedOf(id) {
  const s = ms(id);
  return (s.elapsed || 0) + (clock && clock.mode === id && clock.key === day.key && clock.lang === lang ? Date.now() - clock.start : 0);
}

/* ============================================================ Haptik */
function buzz(kind) {
  if (!store.haptics || !navigator.vibrate) return;
  const pat = { key: 8, tap: 10, ok: [14, 50, 22], bad: [40, 40, 40], win: [20, 60, 20, 60, 90] }[kind];
  try { navigator.vibrate(pat); } catch (e) { /* nicht unterstützt */ }
}
// iPhone: Safari gibt nur beim direkten Antippen eines Schalters ein Haptik-Signal.
// Deshalb liegt über jeder Taste ein unsichtbarer Schalter.
function addHapticSwitch(el) {
  if (!IOS || el.querySelector('.hsw')) return;
  const n = document.createElement('input');
  n.type = 'checkbox'; n.setAttribute('switch', ''); n.className = 'hsw'; n.tabIndex = -1; n.setAttribute('aria-hidden', 'true');
  el.appendChild(n);
}
function applyHaptics() { document.documentElement.classList.toggle('no-haptics', !store.haptics); }

/* ============================================================ Darstellung */
function renderStatic() {
  const t = T();
  document.documentElement.lang = lang;
  [['archiveBtn', t.menu.archive], ['statsBtn', t.menu.stats], ['settingsBtn', t.menu.settings], ['helpBtn', t.menu.help]].forEach(([id, l]) => { const b = $('#' + id); b.setAttribute('aria-label', l); b.title = l; });
  $('#menu').setAttribute('aria-label', lang === 'en' ? 'Menu' : 'Menü');
  $('#modes').setAttribute('aria-label', t.modesAria);
  $('#ruleBtn').setAttribute('aria-label', t.ruleAria);
  $('#timer').title = t.timer; $('#timerSr').textContent = t.timerSr;
  $('#board').setAttribute('aria-label', t.board); $('#stage').setAttribute('aria-label', t.stage);
  $('#newdayText').textContent = t.newday; $('#newdayBtn').textContent = t.newdayBtn; $('#backToday').textContent = t.backToday;
  $('#revealBtn').textContent = t.reveal; $('#revealQ').textContent = t.revealQ; $('#revealYes').textContent = t.revealYes; $('#revealNo').textContent = t.revealNo;
  $('#kb').setAttribute('aria-label', t.kb);
}

function renderHeader() {

  $('#brandName').innerHTML = `<span class="a">${esc(name.slice(0, 3))}</span>${esc(name.slice(3))}`;
  $('#issue').textContent = T().issue(day.number, dateLabel(day.key));

}

function renderTabs() {
  const t = T();
  MODES.forEach(m => {
    const b = $('#tab-' + m.id), s = ms(m.id), p = day.puzzles[m.id];
    b.setAttribute('aria-selected', String(m.id === current));

    if (s.status === 'solved') st = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${fmtTime(s.elapsed)}`;
    else if (s.status === 'revealed') st = t.revealedShort;

}

function renderTimer() {
  if (!day) return;
  const s = ms(current), p = puz(), t = T();
  const txt = fmtTime(elapsedOf(current));
  if ($('#timerText').textContent !== txt) $('#timerText').textContent = txt;
  $('#timer').classList.toggle('stopped', !clock);
  const c = p.words.filter((w, i) => s.typed[i] === w.plain).length;
  const prog = s.status === 'solved' ? t.solved : s.status === 'revealed' ? t.revealed : s.status === 'open' ? t.words(p.words.length) : t.of(c, p.words.length);

}

function renderBar() {
  const s = ms(current);
  let short = T().rules[current].short;
  if (current === 'impossible' && (finished(s) || s.shiftShown)) short = T().shiftShort(day.shift);
  $('#ruleShort').textContent = short;
  renderTimer();
}

function ruleHtml() {
  const t = T(), r = t.rules[current], s = ms(current), p = puz();
  let ex = r.ex;
  if (current === 'impossible' && (finished(s) || s.shiftShown)) ex = t.shiftLong(day.shift, finished(s));
  const um = /[äöüÄÖÜßẞ]/.test(p.fact.t);
  return `<p>${esc(r.text)}</p>` + (ex ? `<p class="ex">${esc(ex)}</p>` : '') + (t.umlauts ? `<p class="note">${esc(t.umlauts(um))}</p>` : '');
}

function renderStart() {
  const p = puz(), t = T();
  const letters = p.words.reduce((n, w) => n + [...w.plain].length, 0);
  $('#startCard').innerHTML =
    `<div class="sc-mode">${esc(modeName(current))}</div>` +
    `<div class="sc-meta">${esc(t.startMeta(p.words.length, letters))}</div>` +

    `<button class="btn primary big" type="button" data-act="start" id="startBtn">` +
      `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>${esc(t.start)}</button>` +
    `<p class="small">${esc(t.startNote)}</p>`;
}

function buildBoard() {
  const p = puz(), s = ms(current), easy = current === 'easy', board = $('#board'), t = T();
  board.classList.toggle('easy', easy);
  let html = '<div class="words">';
  p.words.forEach((w, wi) => {
    const u = wordUnits(w, current), cut = s.cuts.includes(wi);
    let dr;
    if (easy) dr = w.codes.map(c => `<span class="d">${c}</span>`).join('');
    else {
      const parts = [];
      w.codes.forEach((c, ci) => [...String(c)].forEach((ch, k) => parts.push(`<span class="d${cut && ci > 0 && k === 0 ? ' cut' : ''}">${ch}</span>`)));
      dr = parts.join('');
    }
    const cells = [...w.plain].map((_, i) => `<span class="c" data-w="${wi}" data-i="${i}"></span>`).join('');
    const code = easy || cut ? w.codes.join(', ') : w.codes.join(''), L = [...w.plain].length;
    const label = lang === 'en' ? `Word ${wi + 1} of ${p.words.length}, ${L} letters, code ${code}` : `Wort ${wi + 1} von ${p.words.length}, ${L} Buchstaben, Code ${code}`;
    html += `<div class="w" data-w="${wi}" style="--u:${u}" role="group" aria-label="${esc(label)}"><div class="dr" aria-hidden="true">${dr}</div><div class="lr">${cells}</div></div>`;
  });
  board.innerHTML = html + '</div>';
  wordEls = [...board.querySelectorAll('.w')].map(el => ({ el, cells: [...el.querySelectorAll('.c')] }));
  layoutBoard();
  wordEls.forEach((_, i) => updateWord(i));
}

// Eine Kästchengröße für das ganze Blatt, so dass das längste Wort in eine Zeile passt
function layoutBoard() {
  const board = $('#board');
  if (!day || board.hidden) return;
  const avail = board.clientWidth;
  if (!avail) return;
  const maxU = Math.max(...puz().words.map(w => wordUnits(w, current)));
  const cell = Math.max(17, Math.min(30, Math.floor((avail - 2) / (maxU + 1))));
  board.style.setProperty('--cell', cell + 'px');
}

function updateWord(wi) {
  const we = wordEls[wi];
  if (!we) return;
  const s = ms(current), target = lettersOf(wi), cells = cellsOf(s, wi), done = finished(s);
  const solved = isSolvedW(wi, s), given = s.given.includes(wi), full = cells.every(Boolean);
  const hp = s.hints[wi] || [];
  const act = wi === aw && !solved && !done && s.status === 'playing';
  we.cells.forEach((el, i) => {
    const ch = cells[i];
    if (el.textContent !== ch) el.textContent = ch;
    el.classList.toggle('hint', !!ch && hp.includes(i) && ch === target[i]);
    el.classList.toggle('cur', act && i === cur);
  });
  we.el.classList.toggle('ok', solved && !given);
  we.el.classList.toggle('given', solved && given);
  we.el.classList.toggle('bad', full && !solved);
  we.el.classList.toggle('act', act);
  we.el.classList.toggle('locked', solved || done);
}

function buildKeyboard() {
  const t = T();
  $('#kb').innerHTML = t.keyrows.map(row => '<div class="kr">' + row.map(k => {
    if (k === 'next') return `<span class="k wide" role="button" data-k="next" aria-label="${esc(t.nextWord)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>`;
    if (k === 'back') return `<span class="k wide" role="button" data-k="back" aria-label="${esc(t.backspace)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 6H9l-6 6 6 6h12z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg></span>`;
    return `<span class="k" role="button" data-k="${k}" aria-label="${k}"><b>${k}</b><i></i></span>`;
  }).join('') + '</div>').join('');
  $('#kb').querySelectorAll('.k').forEach(addHapticSwitch);
}
function renderKeyboard() {
  const s = ms(current);
  $('#kb').querySelectorAll('.k[data-k]').forEach(k => {
    const i = k.querySelector('i');
    if (!i) return;
    const v = keyShown ? String(letterCode(k.dataset.k, current, day.shift)) : '';
    if (i.textContent !== v) i.textContent = v;
  });
  $('#kb').classList.toggle('off', s.status !== 'playing');
}

function cutTarget(s) {
  const p = puz();
  const ok = i => i >= 0 && i < p.words.length && !isSolvedW(i, s) && !s.cuts.includes(i) && p.words[i].codes.length > 1;
  if (aw != null && ok(aw)) return aw;
  for (let i = 0; i < p.words.length; i++) if (ok(i)) return i;
  return -1;
}

function renderTools() {
  const s = ms(current), t = T(), left = hintsLeft(s), max = CONFIG.hintsPerPuzzle;
  const cutMode = current === 'impossible' && !s.shiftShown;
  $('#hintLabel').textContent = cutMode ? t.cut : t.hint;
  $('#hintBtn').disabled = !left || (cutMode && cutTarget(s) < 0);
  $('#hintBtn').title = cutMode ? t.cutTitle : t.hintTitle;
  $('#hintBtn').setAttribute('aria-label', t.hintAria(cutMode, left, max));
  $('#pips').innerHTML = Array.from({ length: max }, (_, i) => `<i class="${i < left ? 'on' : ''}"></i>`).join('');
  const forbidden = keyForbidden(s);
  $('#keyLabel').textContent = t.key;
  $('#keyBtn').disabled = forbidden || (!keyShown && keyCost() > 0 && !left);
  $('#keyBtn').setAttribute('aria-pressed', String(keyShown));
  $('#keyBtn').title = forbidden ? t.keyForbidden : keyCost() ? t.keyCostTitle : t.keyFree;
  $('#keyCost').textContent = !forbidden && keyCost() && !keyShown ? '−1' : '';
  $('#revealConfirm').hidden = true;
  $('#tools').hidden = false;
}

function squaresOf(id) {
  const s = ms(id), p = day.puzzles[id];
  return p.words.map((w, i) => s.given.includes(i) ? '🟥' : ((s.hints[i] || []).length || s.cuts.includes(i)) ? '🟨' : '🟩').join('');
}

function renderResult() {
  const s = ms(current), p = puz(), box = $('#result'), t = T();
  if (!finished(s)) { box.hidden = true; box.innerHTML = ''; return; }
  const label = s.status === 'solved' ? t.cracked(fmtTime(s.elapsed), s.hintCount) : t.revealed;
  const next = nextOpenMode(current);
  const allDone = MODES.every(m => finished(ms(m.id)));
  const shareIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  box.innerHTML =
    `<div class="label">${esc(label)}</div>` +
    `<div class="squares" aria-hidden="true">${squaresOf(current)}</div>` +
    `<div class="legend">${esc(t.legend)}</div>` +
    `<p class="fact">${esc(p.fact.t)}</p>` +
    `<p class="more">${esc(p.fact.m)}</p>` +
    (allDone && !archive ? `<p class="daydone">${esc(t.dayDone)} <span class="countdown" data-countdown></span>.</p>` : '') +
    '<div class="actions">' +
      `<button class="btn primary" type="button" data-act="share">${shareIcon}${esc(t.share)}</button>` +
      (next ? `<button class="btn" type="button" data-act="next">${esc(t.next(next.name))}</button>` : '') +
      (allDone ? `<button class="btn" type="button" data-act="stats">${esc(t.statsBtn)}</button>` : '') +
    '</div>';
  box.hidden = false;
  tick();
}

function renderStage() {
  const s = ms(current), open = s.status === 'open', done = finished(s);
  $('#startCard').hidden = !open;
  $('#board').hidden = open;
  if (open) renderStart();
  $('#dock').hidden = open || done;
  renderResult();
  if (!open) layoutBoard();
}

function renderAll() {
  renderHeader(); renderTabs(); renderBar(); renderStage();
  if (!finished(ms(current))) { renderTools(); renderKeyboard(); }
  wordEls.forEach((_, i) => updateWord(i));
}

function ensureVisible(wi) {
  const we = wordEls[wi];
  if (!we) return;
  const st = $('#stage'), r = we.el.getBoundingClientRect(), sr = st.getBoundingClientRect();
  if (r.top < sr.top + 4 || r.bottom > sr.bottom - 4) we.el.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
}

/* ============================================================ Ablauf */
function setMode(id) {
  stopClock();
  current = id; aw = null; cur = 0; lastIn = null; keyShown = false; justAdvanced = false;
  buildBoard();
  renderAll();
  $('#stage').scrollTop = 0;
  if (ms(current).status === 'playing') { ensureActive(); resumeClock(); }
}

function setView(key, isArchive, keepMode) {
  stopClock();
  day = buildDay(key, lang); archive = !!isArchive;
  if (keepMode && day.puzzles[keepMode]) return setMode(keepMode);
  const first = MODES.find(m => !finished(ms(m.id)));
  setMode(first ? first.id : 'easy');
}

function setLang(l) {
  if (l !== 'de' && l !== 'en' || l === lang) return;
  stopClock();
  lang = l; store.lang = l; save();
  renderStatic(); buildKeyboard();
  setView(day.key, archive, current);
}

function startMode() {
  const s = ms(current);
  if (s.status !== 'open') return;
  s.status = 'playing'; s.startedOn = realToday();
  save();
  renderAll();
  ensureActive();
  startClock();
  renderTimer();
  buzz('tap');
}

function select(wi, i) {
  const s = ms(current);
  if (s.status !== 'playing' || wi == null || wi < 0 || isSolvedW(wi, s)) return;
  const prev = aw, n = lettersOf(wi).length;
  aw = wi;
  cur = Math.max(0, Math.min(i == null ? firstOpenCell(wi) : i, n - 1));
  lastIn = null;
  if (prev != null && prev !== wi) updateWord(prev);
  updateWord(wi);
  ensureVisible(wi);
}
function firstOpenCell(wi) {
  const s = ms(current), t = lettersOf(wi), c = cellsOf(s, wi);
  const e = c.findIndex(x => !x);
  if (e >= 0) return e;
  const w = c.findIndex((x, k) => x !== t[k]);
  return w >= 0 ? w : 0;
}
function ensureActive() { if (aw == null || isSolvedW(aw)) { const i = nextUnsolved(-1); if (i >= 0) select(i, null); } }

function typeLetter(L) {
  const s = ms(current);
  if (s.status !== 'playing') return;
  ensureActive();
  if (aw == null) return;
  justAdvanced = false;
  const wi = aw, target = lettersOf(wi), n = target.length, cells = cellsOf(s, wi);
  if (keyShown) { keyShown = false; renderKeyboard(); renderTools(); }
  // „ae“ → Ä, „ss“ → ß usw., wenn das vorige Kästchen so ein Buchstabe sein soll
  if (lastIn && lastIn.w === wi && (cur === lastIn.i + 1 || (lastIn.i === n - 1 && cur === n - 1)) && DIGRAPH[target[lastIn.i]] === lastIn.L + L && cells[lastIn.i] === lastIn.L) {
    cells[lastIn.i] = target[lastIn.i];
    lastIn = null;
    setCells(s, wi, cells);
    return afterEdit(wi, false);
  }
  // ß oder Ä getippt, wo im Wort SS oder AE steht
  if (DIGRAPH[L] && target[cur] === DIGRAPH[L][0] && target[cur + 1] === DIGRAPH[L][1]) {
    cells[cur] = target[cur]; cells[cur + 1] = target[cur + 1];
    cur = Math.min(cur + 2, n - 1); lastIn = null;
    setCells(s, wi, cells);
    return afterEdit(wi, true);
  }
  cells[cur] = L;
  if (s.hints[wi]) s.hints[wi] = s.hints[wi].filter(i => cells[i] === target[i]);
  lastIn = { w: wi, i: cur, L };
  if (cur < n - 1) cur++;
  setCells(s, wi, cells);
  afterEdit(wi, true);
}

function afterEdit(wi, typed) {
  const s = ms(current), cells = cellsOf(s, wi);
  if (isSolvedW(wi, s)) {
    flash(wi); buzz('ok');
    if (allSolved()) { save(); return complete('solved'); }
    const nx = nextUnsolved(wi);
    aw = null;
    select(nx, null);
    justAdvanced = true;
  } else if (typed && cells.every(Boolean)) {
    shake(wi); buzz('bad');
  }
  updateWord(wi);
  save();
  renderTabs(); renderTimer();
}

function backspace() {
  const s = ms(current);
  if (s.status !== 'playing') return;
  ensureActive();
  if (aw == null) return;
  justAdvanced = false; lastIn = null;
  const wi = aw, cells = cellsOf(s, wi);
  if (cells[cur]) cells[cur] = '';
  else if (cur > 0) { cur--; cells[cur] = ''; }
  else {
    const pv = nextUnsolved(wi, -1);
    if (pv >= 0 && pv !== wi) select(pv, lettersOf(pv).length - 1);
    return;
  }
  if (s.hints[wi]) s.hints[wi] = s.hints[wi].filter(i => cells[i]);
  setCells(s, wi, cells);
  updateWord(wi); save(); renderTabs(); renderTimer();
}

function moveCursor(d) {
  if (ms(current).status !== 'playing') return;
  ensureActive();
  if (aw == null) return;
  const n = lettersOf(aw).length;
  if (cur + d >= 0 && cur + d < n) { cur += d; lastIn = null; updateWord(aw); return; }
  const nx = nextUnsolved(aw, d);
  if (nx >= 0 && nx !== aw) select(nx, d > 0 ? 0 : lettersOf(nx).length - 1);
}
function nextWord(fromSpace) {
  if (ms(current).status !== 'playing') return;
  if (fromSpace && justAdvanced) { justAdvanced = false; return; }
  justAdvanced = false;
  const nx = nextUnsolved(aw == null ? -1 : aw);
  if (nx >= 0) select(nx, null);
}

// Mehrere Wörter einfügen: Wort 1 → Wort 1 usw. Ein Wort: ab dem gewählten Kästchen.
function pasteText(text) {
  const parts = text.normalize('NFC').split(/\s+/).filter(x => symStr(x));
  if (!parts.length) return;
  if (parts.length === 1) { [...symStr(parts[0])].forEach(typeLetter); return; }
  const s = ms(current);
  puz().words.forEach((w, wi) => {
    if (ms(current).status !== 'playing' || !parts[wi] || isSolvedW(wi, s)) return;
    setCells(s, wi, lettersOf(wi).map(() => ''));
    if (s.hints[wi]) s.hints[wi] = [];
    aw = wi; cur = 0; lastIn = null;
    [...symStr(parts[wi])].forEach(L => { if (aw === wi) typeLetter(L); });
    updateWord(wi);
  });
  if (ms(current).status === 'playing') { const nx = nextUnsolved(-1); aw = null; if (nx >= 0) select(nx, null); }
}

function useHint() {
  const s = ms(current), t = T();
  if (s.status !== 'playing') return;
  if (!hintsLeft(s)) { toast(t.noTips); return; }
  ensureActive();
  if (aw == null) return;
  if (current === 'impossible' && !s.shiftShown) {
    const wi = cutTarget(s);
    if (wi < 0) { toast(t.allCut); return; }
    s.cuts.push(wi); s.hintCount++;
    save(); buildBoard(); select(wi, null); renderTools(); renderTabs();
    toast(t.cutDone(wi + 1));
    buzz('tap');
    return;
  }
  const wi = aw, target = lettersOf(wi), cells = cellsOf(s, wi);
  const i = cells[cur] !== target[cur] ? cur : cells.findIndex((c, k) => c !== target[k]);
  if (i < 0) return;
  cells[i] = target[i];
  (s.hints[wi] || (s.hints[wi] = [])).push(i);
  s.hintCount++;
  setCells(s, wi, cells);
  const after = cells.findIndex((c, k) => k > i && c !== target[k]);
  const any = cells.findIndex((c, k) => c !== target[k]);
  cur = after >= 0 ? after : any >= 0 ? any : i;
  lastIn = null;
  buzz('tap');
  afterEdit(wi, false);
  if (!finished(s)) renderTools();
}

function onKeyBtn() {
  const s = ms(current);
  if (s.status !== 'playing' || keyForbidden(s)) return;
  if (keyShown) { keyShown = false; renderKeyboard(); renderTools(); return; }
  if (keyCost() && !hintsLeft(s)) { toast(T().noTips); return; }
  if (keyCost()) { s.hintCount++; save(); }
  keyShown = true;
  renderKeyboard(); renderTools();
  toast(T().keyShown);
}

function complete(status) {
  const p = puz(), s = ms(current);
  stopClock();
  if (status === 'revealed') {
    s.given = p.words.map((w, i) => i).filter(i => !isSolvedW(i, s));
    p.words.forEach((w, i) => { s.typed[i] = w.plain; });
  }
  s.status = status; s.doneOn = realToday();
  aw = null; keyShown = false;
  save();
  renderAll();
  if (status === 'solved') { burst(); buzz('win'); }
  requestAnimationFrame(() => $('#result').scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }));
}

function shake(wi) {
  const el = wordEls[wi] && wordEls[wi].el;
  if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 400);
}
function flash(wi) {
  const el = wordEls[wi] && wordEls[wi].el;
  if (!el) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 600);
}

function burst() {
  if (reduceMotion()) return;
  const cs = getComputedStyle(document.documentElement);
  const colors = ['--ink', '--marker', '--ok'].map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
  const cv = document.createElement('canvas'), ctx = cv.getContext && cv.getContext('2d');
  if (!ctx || !colors.length) return;
  const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.className = 'confetti'; cv.setAttribute('aria-hidden', 'true');
  cv.width = W * dpr; cv.height = H * dpr;
  document.body.appendChild(cv);
  ctx.scale(dpr, dpr);
  const parts = Array.from({ length: 90 }, () => {
    const a = (-90 + (Math.random() - 0.5) * 70) * Math.PI / 180, v = 12 + Math.random() * 9;
    return { x: W / 2, y: H * 0.7, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 5, h: 3 + Math.random() * 3, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, c: colors[Math.floor(Math.random() * colors.length)] };
  });
  const life = 150;
  let frame = 0;
  (function step() {
    frame++;
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = Math.max(0, 1 - frame / life);
    parts.forEach(p => {
      p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
      ctx.restore();
    });
    if (frame < life) requestAnimationFrame(step); else cv.remove();
  })();
}

/* ============================================================ Statistik, Teilen, Archiv */
function computeStats() {
  const perMode = {}, bestTime = {};
  MODES.forEach(m => { perMode[m.id] = 0; bestTime[m.id] = null; });
  const onDay = new Set(), playedDays = new Set();
  let solvedTotal = 0;
  [store.days, store.daysEn].forEach(map => Object.keys(map || {}).forEach(k => {
    const d = map[k];
    MODES.forEach(m => {
      const s = d[m.id];
      if (!s || !finished(s)) return;
      const same = !s.doneOn || s.doneOn === k;
      if (same) playedDays.add(k);
      if (s.status === 'solved') {
        solvedTotal++; perMode[m.id]++;
        if (bestTime[m.id] == null || s.elapsed < bestTime[m.id]) bestTime[m.id] = s.elapsed;
        if (same) onDay.add(k);
      }
    });
  }));
  let streak = 0, k = realToday();
  if (!onDay.has(k)) k = addDays(k, -1);
  while (onDay.has(k)) { streak++; k = addDays(k, -1); }
  let best = 0, run = 0, prev = null;
  [...onDay].sort().forEach(d => { run = prev && addDays(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  return { played: playedDays.size, solvedTotal, perMode, bestTime, streak, best };
}

function dlgHead(id, title) { return `<div class="dlg-head"><h2 id="${id}">${esc(title)}</h2><button class="ib" type="button" data-close aria-label="${esc(T().close)}">${X}</button></div>`; }

function renderStats() {
  const st = computeStats(), max = Math.max(1, ...Object.values(st.perMode)), t = T().stats;
  $('#statsBody').innerHTML = dlgHead('statsTitle', t.title) +
    '<div class="stats">' +
      `<div><div class="n">${st.played}</div><div class="l">${esc(t.played)}</div></div>` +
      `<div><div class="n">${st.streak}</div><div class="l">${esc(t.streak)}</div></div>` +
      `<div><div class="n">${st.best}</div><div class="l">${esc(t.best)}</div></div>` +
      `<div><div class="n">${st.solvedTotal}</div><div class="l">${esc(t.cracked)}</div></div>` +
    '</div>' +
    `<div><h3>${esc(t.byMode)}</h3><div class="table">` +
      `<span class="h"></span><span class="h"></span><span class="h r">${esc(t.solved)}</span><span class="h r">${esc(t.bestTime)}</span>` +
      MODES.map(m => `<span>${m.name}</span><span class="track"><span class="fill" style="width:${(st.perMode[m.id] / max * 100).toFixed(1)}%"></span></span><span class="r">${st.perMode[m.id]}</span><span class="r">${st.bestTime[m.id] == null ? '–' : fmtTime(st.bestTime[m.id])}</span>`).join('') +
    '</div></div>' +
    `<p class="small">${esc(t.note)} <span class="countdown" data-countdown></span>.</p>` +
    `<button class="btn primary" type="button" data-act="share">${esc(T().share)}</button>`;
  tick();
}

function siteUrl() {
  const base = CONFIG.siteUrl || (/^https?:$/.test(location.protocol) && !/claude/.test(location.hostname) ? location.origin + location.pathname.replace(/index\.html$/, '') : '');
  return base && lang === 'en' ? base + '?lang=en' : base;
}
// Teilen-Text: verrät nie die Lösung, nur Kästchen pro Wort, Stufe und Zeit
function shareText() {
  const t = T(), done = MODES.filter(m => finished(ms(m.id)));
  const url = siteUrl();
  const line = m => { const s = ms(m.id); return s.status === 'solved' ? `${m.name} ⏱ ${fmtTime(s.elapsed)}` : `${m.name} · ${t.revealedWord}`; };
  const lines = [];
  if (done.length === 1) {
    lines.push(`${t.shareHead(day.number, archive)} · ${line(done[0])}`, squaresOf(done[0].id));
  } else {
    lines.push(t.shareHead(day.number, archive));
    if (!done.length) lines.push(t.nothing);
    done.forEach(m => lines.push(line(m), squaresOf(m.id)));
  }
  const solvedN = done.filter(m => ms(m.id).status === 'solved').length;
  const call = solvedN > 1 ? t.beatMany : solvedN === 1 ? t.beatOne : t.crackIt;
  lines.push(url ? `${call} ${url}` : call);
  return lines.join('\n');
}

async function doShare(btn) {
  const text = shareText(), t = T();
  if (navigator.share && mq('(pointer: coarse)')) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast(t.copied);
    if (btn) { const old = btn.innerHTML; btn.textContent = t.copiedBtn; setTimeout(() => { btn.innerHTML = old; }, 1800); }
  } catch (e) {
    $('#shareBody').innerHTML = dlgHead('shareTitle', t.shareDlg.title) +
      `<p class="small">${esc(t.shareDlg.note)}</p><textarea id="shareText" rows="8" readonly></textarea>` +
      `<button class="btn primary" type="button" data-close>${esc(t.shareDlg.done)}</button>`;
    const ta = $('#shareText');
    ta.value = text;
    openDlg($('#shareDlg'));
    ta.focus(); ta.select();
  }
}

function renderArchive() {
  const t = T().archive, tk = realToday(), n = Math.max(0, dayIndex(tk)), map = daysMap();
  let html = dlgHead('archiveTitle', t.title) + `<p class="small">${esc(t.intro)}</p><div class="days" id="days">`;
  for (let i = n; i >= 0; i--) {
    const key = addDays(CONFIG.launchDate, i), d = map[key] || {};
    const marks = MODES.map(m => {
      const s = d[m.id], st = (s && s.status) || 'open';
      const cls = st === 'solved' ? 's' : st === 'revealed' ? 'v' : st === 'playing' ? 'p' : '';
      const sym = st === 'solved' ? '✓' : st === 'revealed' ? '×' : m.name[0];
      return `<span class="${cls}" title="${m.name}: ${t.st[st] || t.st.open}">${sym}</span>`;
    }).join('');
    html += `<button class="day" type="button" data-day="${key}"><span class="t">${i === n ? esc(t.today) : '#' + (i + 1)}<small>${i === n ? '#' + (i + 1) + ' · ' : ''}${esc(dateLabel(key, true))}</small></span><span class="marks">${marks}</span></button>`;
  }
  $('#archiveBody').innerHTML = html + '</div>';
}

function langSeg(name) {
  return `<div class="seg two" role="radiogroup" aria-label="${esc(T().settings.language)}">` +
    [['de', 'Deutsch'], ['en', 'English']].map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" data-lang="${v}"${lang === v ? ' checked' : ''}><span lang="${v}">${l}</span></label>`).join('') + '</div>';
}

function renderHelp() {
  const h = T().help, [word, codes] = h.demo;
  $('#helpBody').innerHTML =
    '<div class="dlg-head"><div><div class="eyebrow">' + esc(CONFIG.tagline.toUpperCase()) + `</div><h2 id="helpTitle">${esc(h.title)}</h2></div><button class="ib" type="button" data-close aria-label="${esc(T().close)}">${X}</button></div>` +
    langSeg('helpLang') +
    `<p>${esc(h.intro)}</p>` +
    `<div class="demo" aria-label="${esc(h.demoAria)}">` + [...word].map((L, i) => `<div><b>${codes[i]}</b><span>${L}</span></div>`).join('') + '</div>' +
    '<ul class="howto">' + h.items.map(x => `<li>${x}</li>`).join('') + '</ul>' +
    `<p class="small">${esc(h.streak)}</p>` +
    `<button class="btn primary" type="button" data-close>${esc(h.go)}</button>`;
}

function renderSettings() {
  const t = T().settings;
  $('#settingsBody').innerHTML = dlgHead('settingsTitle', t.title) +
    `<div><h3>${esc(t.language)}</h3>${langSeg('settingsLang')}</div>` +
    `<div><h3 id="themeLabel">${esc(t.theme)}</h3><div class="seg" role="radiogroup" aria-labelledby="themeLabel">` +
      [['system', t.system], ['light', t.light], ['dark', t.dark]].map(([v, l]) => `<label><input type="radio" name="theme" id="theme-${v}" value="${v}"${(store.theme || 'system') === v ? ' checked' : ''}><span>${esc(l)}</span></label>`).join('') +
    '</div></div>' +
    `<div class="row"><label for="hapticsToggle"><strong>${esc(t.haptics)}</strong><br><span class="small">${esc(t.hapticsNote)}</span></label><input type="checkbox" switch id="hapticsToggle"${store.haptics ? ' checked' : ''}></div>` +
    `<p class="small">${esc(t.storage)}</p>` +
    `<button class="btn primary" type="button" data-close>${esc(t.done)}</button>`;
}

function openRule() {
  $('#ruleBody').innerHTML = dlgHead('ruleTitle', T().ruleTitle(modeName(current))) + ruleHtml();
  openDlg($('#ruleDlg'));
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

function applyTheme() {
  const t = store.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

/* ============================================================ Countdown, Tageswechsel, Dialoge */
function tick() {
  renderTimer();
  const n = new Date(), mid = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
  const txt = fmtHMS(mid - n);
  document.querySelectorAll('[data-countdown]').forEach(el => { if (el.textContent !== txt) el.textContent = txt; });
  if (realToday() !== openedOn) $('#newday').hidden = false;
}
function openDlg(d) { stopClock(); if (typeof d.showModal === 'function') { if (!d.open) d.showModal(); } else d.setAttribute('open', ''); }
function closeDlg(d) { if (typeof d.close === 'function') d.close(); else d.removeAttribute('open'); }

/* ============================================================ Ereignisse */
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
$('#hintBtn').addEventListener('click', useHint);
$('#keyBtn').addEventListener('click', onKeyBtn);
$('#revealBtn').addEventListener('click', () => { $('#revealConfirm').hidden = false; $('#tools').hidden = true; $('#revealNo').focus(); });
$('#revealNo').addEventListener('click', () => { $('#revealConfirm').hidden = true; $('#tools').hidden = false; });
$('#revealYes').addEventListener('click', () => complete('revealed'));
$('#statsBtn').addEventListener('click', () => { renderStats(); openDlg($('#statsDlg')); });
$('#helpBtn').addEventListener('click', () => { renderHelp(); openDlg($('#helpDlg')); });
$('#settingsBtn').addEventListener('click', () => { renderSettings(); openDlg($('#settingsDlg')); });
$('#archiveBtn').addEventListener('click', () => { renderArchive(); openDlg($('#archiveDlg')); });
$('#ruleBtn').addEventListener('click', openRule);
$('#newdayBtn').addEventListener('click', () => { openedOn = realToday(); $('#newday').hidden = true; setView(openedOn, false); });
$('#backToday').addEventListener('click', () => setView(realToday(), false));
$('#archiveDlg').addEventListener('click', e => {
  const b = e.target.closest('[data-day]');
  if (!b) return;
  closeDlg($('#archiveDlg'));
  setView(b.dataset.day, b.dataset.day !== realToday());
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.lang) {
    const dlg = el.closest('dialog');
    setLang(el.dataset.lang);
    if (dlg && dlg.id === 'helpDlg') renderHelp();
    if (dlg && dlg.id === 'settingsDlg') renderSettings();
  } else if (el.name === 'theme') { store.theme = el.value; save(); applyTheme(); }
  else if (el.id === 'hapticsToggle') { store.haptics = el.checked; save(); applyHaptics(); if (store.haptics) buzz('ok'); }
});

$('#kb').addEventListener('click', e => {
  const k = e.target.closest('.k');
  if (!k) return;
  const v = k.dataset.k;
  if (ms(current).status !== 'playing') return;
  buzz('key');
  if (v === 'back') backspace();
  else if (v === 'next') nextWord(false);
  else typeLetter(v);
});
$('#board').addEventListener('click', e => {
  const c = e.target.closest('.c');
  if (c) { select(+c.dataset.w, +c.dataset.i); buzz('tap'); return; }
  const w = e.target.closest('.w');
  if (w) { select(+w.dataset.w, null); buzz('tap'); }
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'start') startMode();
  else if (act === 'next') { const m = nextOpenMode(current); if (m) setMode(m.id); }
  else if (act === 'share') doShare(b);
  else if (act === 'stats') { renderStats(); openDlg($('#statsDlg')); }
});

document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) closeDlg(d); });
  d.addEventListener('close', () => { resumeClock(); });
});
$('#helpDlg').addEventListener('close', () => { if (!store.seenHelp) { store.seenHelp = true; save(); } });

// Tippen mit echter Tastatur (Computer)
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !day) return;
  if (document.querySelector('dialog[open]')) return;
  const t = e.target, tag = t && t.tagName;
  if ((tag === 'INPUT' && t.type !== 'checkbox' && t.type !== 'radio') || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
  const s = ms(current), onButton = tag === 'BUTTON';
  if (s.status === 'open') { if (e.key === 'Enter' && !onButton) { e.preventDefault(); startMode(); } return; }
  if (s.status !== 'playing') return;
  const k = e.key;
  if (k.length === 1 && symStr(k)) { e.preventDefault(); [...symStr(k)].forEach(typeLetter); return; }
  if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); backspace(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); moveCursor(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); moveCursor(1); }
  else if (k === 'ArrowUp') { e.preventDefault(); const p = nextUnsolved(aw == null ? 0 : aw, -1); if (p >= 0) select(p, null); }
  else if (k === 'ArrowDown') { e.preventDefault(); nextWord(false); }
  else if ((k === 'Enter' || k === ' ') && !onButton) { e.preventDefault(); nextWord(k === ' '); }
});
document.addEventListener('paste', e => {
  if (!day || document.querySelector('dialog[open]') || ms(current).status !== 'playing') return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!text) return;
  e.preventDefault();
  pasteText(text);
});

// Spielt jemand in einem zweiten Tab, übernimmt dieser Tab dessen Stand, statt ihn zu überschreiben
window.addEventListener('storage', e => {
  if (e.key !== CONFIG.storageKey || !day) return;
  store = loadStore(); fixStore();
  if (clock && ms(current).status !== 'playing') clock = null;
  buildBoard(); renderAll();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopClock(); else { resumeClock(); tick(); } });
window.addEventListener('pagehide', stopClock);
let rz;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layoutBoard); });
setInterval(tick, 500);

/* Start */
applyTheme(); applyHaptics();
renderStatic(); buildKeyboard();
if (!store.seenHelp) { renderHelp(); openDlg($('#helpDlg')); }
setView(realToday(), false);
tick();
})();
</script>
