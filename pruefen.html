<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fakten prüfen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Martian+Mono:wght@500;800&display=swap">
<style>
/* Layout: Arbeitsseite für die Pflege. Oben Zusammenfassung, dann Probleme, dann der Fahrplan der nächsten Tage. */
:root{
  --paper:#f2f4f7; --sheet:#ffffff; --line:#d2d9e3; --text:#17202e; --muted:#596377; --ink:#1f3fa6;
  --ok:#17803a; --warn:#8a5a00; --red:#c62f27; --okbg:#e3f6e8; --warnbg:#fdf3dc; --redbg:#fde8e6;
  --display:"Martian Mono", ui-monospace, Menlo, Consolas, monospace;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#111715; --sheet:#19221f; --line:#2f3b37; --text:#e6ece8; --muted:#9ba7a2; --ink:#a5b9ff;
    --ok:#5fd47f; --warn:#f0c060; --red:#ff7d70; --okbg:#18301f; --warnbg:#33290f; --redbg:#3a1a17; color-scheme:dark }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 56px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem}
h2{margin:0 0 10px;font-family:var(--display);font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
p{margin:0;max-width:65ch}
.lead{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .n{font-family:var(--display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.tile .l{font-size:.86rem;color:var(--muted)}
.tile.bad{border-color:var(--red);background:var(--redbg)}
.tile.warn{border-color:var(--warn);background:var(--warnbg)}
.tile.good{border-color:var(--ok);background:var(--okbg)}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:6px;padding:8px 12px;font-size:.95rem}
.list li.fehler{border-left-color:var(--red)}
.list b{font-variant-numeric:tabular-nums}
.empty{background:var(--okbg);border:1px solid var(--ok);border-radius:8px;padding:10px 14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.78rem;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--sheet)}
td.nr{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.today td{background:var(--okbg)}
tr.repeat td{color:var(--muted)}
.m{display:block;font-size:.75rem;color:var(--muted);font-weight:700}
.flag{color:var(--warn);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fakten prüfen</h1>
    <p class="lead">Diese Seite liest fakten.js und zeigt, ob alles passt und welche Rätsel in den nächsten Tagen kommen. Sie ist nicht verlinkt, enthält aber die Lösungen. Nicht weitergeben.</p>
  </header>
  <section class="tiles" id="tiles"></section>
  <section>
    <h2>Probleme in der Liste</h2>
    <div id="problems"></div>
  </section>
  <section>
    <h2>Fahrplan ab heute</h2>
    <div class="tablewrap"><table><thead><tr><th>Nr. / Datum</th><th>Easy</th><th>Hard</th><th>Mirror</th><th>Impossible</th></tr></thead><tbody id="plan"></tbody></table></div>
  </section>
</div>
<script src="fakten.js"></script>
<script src="kern.js"></script>
<script>
(function () {
  const NF = window.NF, $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (!NF || !NF.facts().length) { $('#tiles').innerHTML = '<div class="tile bad"><div class="n">Fehler</div><div class="l">fakten.js oder kern.js konnte nicht geladen werden. Oft fehlt ein Komma oder ein Anführungszeichen.</div></div>'; return; }
  const F = NF.facts(), today = NF.todayKey(), last = NF.lastPlannedDay();
  const fmt = k => { const [y, m, d] = NF.parseKey(k); return new Date(y, m - 1, d).toLocaleDateString('de-AT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
  const daysLeft = Math.round((Date.UTC(...NF.parseKey(last).map((v, i) => i === 1 ? v - 1 : v)) - Date.UTC(...NF.parseKey(today).map((v, i) => i === 1 ? v - 1 : v))) / 864e5);
  const probs = NF.checkFacts(), errs = probs.filter(p => p.level === 'fehler');
  $('#tiles').innerHTML =
    `<div class="tile"><div class="n">${F.length}</div><div class="l">Fakten in der Liste</div></div>` +
    `<div class="tile ${daysLeft < 0 ? 'bad' : daysLeft < 7 ? 'warn' : 'good'}"><div class="n">${esc(fmt(last))}</div><div class="l">${daysLeft < 0 ? 'Liste aufgebraucht, alte Fakten wiederholen sich' : `reichen noch ${daysLeft + 1} Tage ohne Wiederholung`}</div></div>` +
    `<div class="tile ${errs.length ? 'bad' : 'good'}"><div class="n">${errs.length}</div><div class="l">Fehler (müssen behoben werden)</div></div>` +
    `<div class="tile ${probs.length - errs.length ? 'warn' : 'good'}"><div class="n">${probs.length - errs.length}</div><div class="l">Hinweise</div></div>`;
  $('#problems').innerHTML = probs.length
    ? '<ul class="list">' + probs.map(p => `<li class="${p.level}"><b>Fakt ${p.i + 1}</b> (Nr. ${Math.floor(p.i / 4) + 1}): ${esc(p.msg)}<br><span class="m">${esc(F[p.i] && F[p.i].t || '')}</span></li>`).join('') + '</ul>'
    : '<p class="empty">Alles in Ordnung.</p>';
  const start = Math.max(0, NF.dayIndex(today)), end = Math.max(start + 21, NF.dayIndex(last) + 3);
  let rows = '';
  for (let i = start; i <= end; i++) {
    const key = NF.addDays(NF.CONFIG.launchDate, i), d = NF.buildDay(key), repeat = key > last;
    rows += `<tr class="${key === today ? 'today' : ''}${repeat ? ' repeat' : ''}"><td class="nr">Nr. ${d.number}<span class="m">${esc(fmt(key))}${key === today ? ' · heute' : ''}${repeat ? ' · Wiederholung' : ''}</span></td>` +
      NF.MODES.map(m => {
        const p = d.puzzles[m.id], units = Math.max(...p.words.map(w => NF.wordUnits(w, m.id)));
        const flag = units > NF.CONFIG.maxCells ? `<span class="flag"> · ${units} Kästchen, bricht am Handy um</span>` : '';
        return `<td>${esc(p.fact.t)}<span class="m">${p.words.length} Wörter${m.id === 'impossible' ? ' · Verschiebung ' + d.shift : ''}${flag}</span></td>`;
      }).join('') + '</tr>';
  }
  $('#plan').innerHTML = rows;
})();
</script>
</body>
</html>
